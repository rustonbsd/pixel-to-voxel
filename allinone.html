<!doctype html>
<html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>3D North Arrow</title>
<style>
    :root {
        --w: 160px;
        /* phone width  (short side) */
        --h: 300px;
        /* phone height (long side)  */
        --d: 12px;
        /* phone thickness           */
        --bg: #0b1020;
    }

    body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: #e6edf3;
        font-family: system-ui, sans-serif;
    }

    .row {
        display: flex;
        gap: 12px;
        align-items: center;
    }

    button {
        padding: 8px 12px;
    }

    #hud {
        font-variant-numeric: tabular-nums;
        margin-top: 8px;
    }

    .scene {
        width: 100%;
        height: 60vh;
        margin-top: 20px;
        display: grid;
        place-items: center;
        perspective: 2000px;
        perspective-origin: 50% 48%;
    }

    .world {
        position: relative;
        width: 420px;
        height: 420px;
        border: 1px solid #263043;
        border-radius: 12px;
        background: radial-gradient(circle at center, #111a33 0%, #0b1020 72%);
        transform-style: preserve-3d;
        overflow: visible;
    }

    /* 3D multi-axis arrows */
    /* Anchor centered, no Z offset so arrows sit in middle of box */
    .anchor {
        position: absolute;
        left: 50%;
        top: 50%;
        transform-style: preserve-3d;
        transform: translate(-50%, -50%) translateZ(220px) scale(0.95);
        width: 0;
        height: 0;
    }

    .arrow-group {
        position: absolute;
        left: 0;
        top: 0;
        transform-style: preserve-3d;
        width: 0;
        height: 0;
    }

    .arrow3d {
        position: absolute;
        left: 0;
        top: 0;
        transform-style: preserve-3d;
        width: 0;
        height: 0;
        backface-visibility: visible;
    }

    /* Base arrow geometry extends upward (-Y) */
    .shaft {
        position: absolute;
        left: -3px;
        top: -90px;
        width: 6px;
        height: 90px;
        background: linear-gradient(#203550, #3b5d88);
        border-radius: 4px;
        box-shadow: 0 0 4px rgba(0, 180, 255, 0.35);
        backface-visibility: visible;
    }

    .head {
        position: absolute;
        left: -9px;
        top: -124px;
        width: 18px;
        height: 34px;
        background: linear-gradient(#ff4662, #ff0030);
        clip-path: polygon(50% 0, 100% 100%, 0 100%);
        border-radius: 4px 4px 8px 8px;
        box-shadow: 0 0 5px rgba(255, 70, 98, 0.55);
        backface-visibility: visible;
    }

    .arrow-n .shaft {
        background: linear-gradient(#ff4662, #ff0030);
    }

    .arrow-n .head {
        background: linear-gradient(#ff6b80, #ff2345);
    }

    .arrow-e .shaft {
        background: linear-gradient(#ff9d1d, #ffc14a);
    }

    .arrow-e .head {
        background: linear-gradient(#ffc55a, #ff9d1d);
    }

    .arrow-w .shaft {
        background: linear-gradient(#8b5cf6, #b493ff);
    }

    .arrow-w .head {
        background: linear-gradient(#b493ff, #8b5cf6);
    }

    .arrow-up .shaft {
        background: linear-gradient(#2ee6a6, #6ff3c5);
    }

    .arrow-up .head {
        background: linear-gradient(#6ff3c5, #2ee6a6);
    }

    .shadow {
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        transform-style: preserve-3d;
        filter: blur(10px) opacity(0.25);
        backface-visibility: visible;
    }

    .shadow .shaft,
    .shadow .head {
        background: #000 !important;
        box-shadow: none;
    }

    .grid-plane {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 440px;
        height: 440px;
        transform: translate(-50%, -50%) rotateX(90deg) translateZ(-260px);
        background: repeating-linear-gradient(0deg, #162339 0 26px, #1c2c47 26px 52px), repeating-linear-gradient(90deg, #162339 0 26px, #1c2c47 26px 52px);
        mix-blend-mode: screen;
        opacity: 0.14;
        border: 1px solid #263043;
        backface-visibility: visible;
        pointer-events: none;
    }

    .label {
        position: absolute;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: #8aa4d1;
    }

    .label.n {
        top: 4px;
        left: 50%;
        transform: translateX(-50%);
    }

    .label.s {
        bottom: 4px;
        left: 50%;
        transform: translateX(-50%);
    }

    .label.e {
        top: 50%;
        right: 6px;
        transform: translateY(-50%);
    }

    .label.w {
        top: 50%;
        left: 6px;
        transform: translateY(-50%);
    }
</style>

<body>
    <div class="row">
        <button id="start">Start sensors</button>
        <span id="status">Idle</span>
    </div>
    <div id="hud">northVec=(0,1,0)</div>

    <div class="scene">
        <div class="world" id="world">
            <div class="grid-plane"></div>
            <div class="label n">N</div>
            <div class="label s">S</div>
            <div class="label e">E</div>
            <div class="label w">W</div>
            <div class="anchor" id="anchor">
                <div class="arrow-group" id="arrowGroup">
                    <div class="shadow" id="northShadow">
                        <div class="shaft"></div>
                        <div class="head"></div>
                    </div>
                    <div class="arrow3d arrow-n" id="northArrow">
                        <div class="shaft"></div>
                        <div class="head"></div>
                    </div>
                    <div class="shadow" id="eastShadow">
                        <div class="shaft"></div>
                        <div class="head"></div>
                    </div>
                    <div class="arrow3d arrow-e" id="eastArrow">
                        <div class="shaft"></div>
                        <div class="head"></div>
                    </div>
                    <div class="shadow" id="westShadow">
                        <div class="shaft"></div>
                        <div class="head"></div>
                    </div>
                    <div class="arrow3d arrow-w" id="westArrow">
                        <div class="shaft"></div>
                        <div class="head"></div>
                    </div>
                    <div class="shadow" id="upShadow">
                        <div class="shaft"></div>
                        <div class="head"></div>
                    </div>
                    <div class="arrow3d arrow-up" id="upArrow">
                        <div class="shaft"></div>
                        <div class="head"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        const statusEl = document.getElementById("status");
        const hudEl = document.getElementById("hud");
        // 3D North arrow elements
        const anchorEl = document.getElementById("anchor");
        const northArrowEl = document.getElementById("northArrow");
        const northShadowEl = document.getElementById("northShadow");
        const eastArrowEl = document.getElementById("eastArrow");
        const eastShadowEl = document.getElementById("eastShadow");
        const westArrowEl = document.getElementById("westArrow");
        const westShadowEl = document.getElementById("westShadow");
        const upArrowEl = document.getElementById("upArrow");
        const upShadowEl = document.getElementById("upShadow");
        const arrowGroupEl = document.getElementById("arrowGroup");
        const startBtn = document.getElementById("start");

        // Only need yaw heading -> North. Arrow graphic points upward (0deg = North)

        // Quaternion [x, y, z, w] -> row-major 3x3 (device -> world ENU)
        function quatToMat3(qx, qy, qz, qw) {
            const xx = qx * qx,
                yy = qy * qy,
                zz = qz * qz;
            const xy = qx * qy,
                xz = qx * qz,
                yz = qy * qz;
            const wx = qw * qx,
                wy = qw * qy,
                wz = qw * qz;
            return [
                1 - 2 * (yy + zz), 2 * (xy - wz), 2 * (xz + wy),
                2 * (xy + wz), 1 - 2 * (xx + zz), 2 * (yz - wx),
                2 * (xz - wy), 2 * (yz + wx), 1 - 2 * (xx + yy),
            ];
        }

        // Compute device->world matrix (already) then build world-North vector in device frame: n_dev = R^T * (0,1,0) = (r10,r11,r12)
        // Align base +Y (0,1,0) to n_dev via axis-angle.
        function northVectorDevice(R) {
            return [R[3], R[4], R[5]];
        }

        function eastVectorDevice(R) {
            return [R[0], R[1], R[2]];
        }

        function upVectorDevice(R) {
            return [R[6], R[7], R[8]];
        }

        function normalize(v) {
            const m = Math.hypot(v[0], v[1], v[2]);
            return m ? [v[0] / m, v[1] / m, v[2] / m] : [0, 1, 0];
        }

        function rotationFromYTo(v) {
            const b = normalize(v);
            const dot = b[1];
            if (dot > 0.9995) return {
                axis: [0, 1, 0],
                angleDeg: 0
            };
            if (dot < -0.9995) return {
                axis: [1, 0, 0],
                angleDeg: 180
            };
            // axis = a x b where a=(0,1,0)
            const axis = [b[2], 0, -b[0]];
            const axisLen = Math.hypot(axis[0], axis[1], axis[2]) || 1;
            const ax = axis[0] / axisLen,
                ay = 0,
                az = axis[2] / axisLen;
            const angleRad = Math.atan2(Math.hypot(axis[0], axis[2]), dot);
            return {
                axis: [ax, ay, az],
                angleDeg: angleRad * 180 / Math.PI
            };
        }
        // Invert yaw sense helper (flip horizontal components)
        function invertYawVec(v) {
            return [-v[0], v[1], -v[2]];
        }
        // (Removed inversion) Arrow points toward true North in world frame.
        function cssRotateAxisAngle(axis, angleDeg) {
            return `rotate3d(${axis[0]},${axis[1]},${axis[2]},${angleDeg}deg)`;
        }

        // No face relabeling needed now.

        async function start() {
            // Try to lock to portrait so device axes are consistent
            if (screen.orientation && screen.orientation.lock) {
                try {
                    await screen.orientation.lock("portrait-primary");
                } catch {}
            }

            statusEl.textContent = "Starting…";
            const freq = 60;
            try {
                const sensor = new AbsoluteOrientationSensor({
                    frequency: freq
                });
                sensor.addEventListener("reading", () => {
                    const q = sensor.quaternion; // [x,y,z,w]
                    if (!q) return;
                    const R = quatToMat3(q[0], q[1], q[2], q[3]);
                    let nDev = northVectorDevice(R);
                    let eDev = eastVectorDevice(R);
                    nDev = invertYawVec(nDev);
                    eDev = invertYawVec(eDev);
                    const wDev = eDev.map(v => -v);
                    const uDev = upVectorDevice(R);
                    const nRot = rotationFromYTo(nDev);
                    const eRot = rotationFromYTo(eDev);
                    const wRot = rotationFromYTo(wDev);
                    const uRot = rotationFromYTo(uDev);
                    const tn = cssRotateAxisAngle(nRot.axis, nRot.angleDeg);
                    const te = cssRotateAxisAngle(eRot.axis, eRot.angleDeg);
                    const tw = cssRotateAxisAngle(wRot.axis, wRot.angleDeg);
                    const tu = cssRotateAxisAngle(uRot.axis, uRot.angleDeg);
                    northArrowEl.style.transform = tn;
                    northShadowEl.style.transform = tn;
                    eastArrowEl.style.transform = te;
                    eastShadowEl.style.transform = te;
                    westArrowEl.style.transform = tw;
                    westShadowEl.style.transform = tw;
                    upArrowEl.style.transform = tu;
                    upShadowEl.style.transform = tu;
                    hudEl.textContent = `N=(${nDev.map(v=>v.toFixed(2)).join(',')}) E=(${eDev.map(v=>v.toFixed(2)).join(',')}) U=(${uDev.map(v=>v.toFixed(2)).join(',')})`;
                    statusEl.textContent = "Live (Absolute)";
                });
                sensor.addEventListener("error", (e) => {
                    statusEl.textContent = "AbsoluteOrientation error";
                    console.error(e.error || e);
                });
                await sensor.start();
            } catch (absErr) {
                // Fallback to RelativeOrientationSensor (no absolute yaw; still useful for viz)
                try {
                    const sensor = new RelativeOrientationSensor({
                        frequency: freq
                    });
                    sensor.addEventListener("reading", () => {
                        const q = sensor.quaternion;
                        if (!q) return;
                        const R = quatToMat3(q[0], q[1], q[2], q[3]);
                        let nDev = northVectorDevice(R);
                        let eDev = eastVectorDevice(R);
                        nDev = invertYawVec(nDev);
                        eDev = invertYawVec(eDev);
                        const wDev = eDev.map(v => -v);
                        const uDev = upVectorDevice(R);
                        const nRot = rotationFromYTo(nDev);
                        const eRot = rotationFromYTo(eDev);
                        const wRot = rotationFromYTo(wDev);
                        const uRot = rotationFromYTo(uDev);
                        const tn = cssRotateAxisAngle(nRot.axis, nRot.angleDeg);
                        const te = cssRotateAxisAngle(eRot.axis, eRot.angleDeg);
                        const tw = cssRotateAxisAngle(wRot.axis, wRot.angleDeg);
                        const tu = cssRotateAxisAngle(uRot.axis, uRot.angleDeg);
                        northArrowEl.style.transform = tn;
                        northShadowEl.style.transform = tn;
                        eastArrowEl.style.transform = te;
                        eastShadowEl.style.transform = te;
                        westArrowEl.style.transform = tw;
                        westShadowEl.style.transform = tw;
                        upArrowEl.style.transform = tu;
                        upShadowEl.style.transform = tu;
                        hudEl.textContent = `rel N=(${nDev.map(v=>v.toFixed(2)).join(',')}) E=(${eDev.map(v=>v.toFixed(2)).join(',')}) U=(${uDev.map(v=>v.toFixed(2)).join(',')})`;
                        statusEl.textContent = "Live (Relative)";
                    });
                    await sensor.start();
                } catch (relErr) {
                    statusEl.textContent = "Orientation sensors unavailable";
                    console.error(absErr, relErr);
                    alert("Orientation sensors unavailable on this device/browser.");
                }
            }
        }

        startBtn.onclick = () => start();
    </script>
</body>

</html>
