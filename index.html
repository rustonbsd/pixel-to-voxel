<!doctype html>
<html>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>3D North Arrow</title>
  <style>
    :root {
      --w: 160px;  /* phone width  (short side) */
      --h: 300px;  /* phone height (long side)  */
      --d: 12px;   /* phone thickness           */
      --bg: #0b1020;
    }
    body {
      margin: 0; padding: 16px; background: var(--bg);
      color: #e6edf3; font-family: system-ui, sans-serif;
    }
    .row { display: flex; gap: 12px; align-items: center; }
    button { padding: 8px 12px; }

    #hud { font-variant-numeric: tabular-nums; margin-top: 8px; }

  .scene { width:100%; height:60vh; margin-top:20px; display:grid; place-items:center; perspective:900px; }
  .world { position:relative; width:420px; height:420px; border:1px solid #263043; border-radius:12px; background:radial-gradient(circle at center,#111a33 0%,#0b1020 70%); transform-style:preserve-3d; }
    .world { position:relative; width:420px; height:420px; border:1px solid #263043; border-radius:12px; background:radial-gradient(circle at center,#111a33 0%,#0b1020 70%); transform-style:preserve-3d; overflow:visible; }

  /* 3D North arrow */
  .anchor { position:absolute; left:50%; top:50%; transform-style:preserve-3d; transform:translate(-50%,-50%); width:0; height:0; }
    .arrow3d { position:relative; transform-style:preserve-3d; width:0; height:0; }
    /* Arrow geometry extends upward (-Y) so base stays at origin */
    .shaft { position:absolute; left:-3px; top:-100px; width:6px; height:100px; background:linear-gradient(#203550,#3b5d88); border-radius:4px; box-shadow:0 0 4px rgba(0,180,255,0.35); }
    .head { position:absolute; left:-10px; top:-138px; width:20px; height:40px; background:linear-gradient(#ff4662,#ff0030); clip-path:polygon(50% 0,100% 100%,0 100%); border-radius:4px 4px 10px 10px; box-shadow:0 0 6px rgba(255,70,98,0.55); }
  .shadow { position:absolute; left:0; top:0; width:0; height:0; transform-style:preserve-3d; filter:blur(12px) opacity(0.25); }
  .shadow .shaft { background:#000; box-shadow:none; }
  .shadow .head { background:#000; box-shadow:none; }
  .grid-plane { position:absolute; left:50%; top:50%; width:380px; height:380px; transform:translate(-50%,-50%) rotateX(90deg) translateZ(-40px); background:repeating-linear-gradient(0deg,#162339 0 24px,#1c2c47 24px 48px), repeating-linear-gradient(90deg,#162339 0 24px,#1c2c47 24px 48px); mix-blend-mode:screen; opacity:0.35; border:1px solid #263043; }
    .grid-plane { position:absolute; left:50%; top:50%; width:380px; height:380px; transform:translate(-50%,-50%) rotateX(90deg) translateZ(-60px); background:repeating-linear-gradient(0deg,#162339 0 24px,#1c2c47 24px 48px), repeating-linear-gradient(90deg,#162339 0 24px,#1c2c47 24px 48px); mix-blend-mode:screen; opacity:0.18; border:1px solid #263043; }
  .label { position:absolute; font-size:12px; font-weight:600; letter-spacing:0.06em; color:#8aa4d1; }
  .label.n { top:4px; left:50%; transform:translateX(-50%); }
  .label.s { bottom:4px; left:50%; transform:translateX(-50%); }
  .label.e { top:50%; right:6px; transform:translateY(-50%); }
  .label.w { top:50%; left:6px; transform:translateY(-50%); }
  </style>

  <body>
    <div class="row">
      <button id="start">Start sensors</button>
      <span id="status">Idle</span>
    </div>
  <div id="hud">northVec=(0,1,0)</div>

    <div class="scene">
      <div class="world" id="world">
        <div class="grid-plane"></div>
        <div class="label n">N</div>
        <div class="label s">S</div>
        <div class="label e">E</div>
        <div class="label w">W</div>
        <div class="anchor" id="anchor">
          <div class="shadow" id="northArrowShadow">
            <div class="shaft"></div>
            <div class="head"></div>
          </div>
          <div id="northArrow">
            <div class="shaft"></div>
            <div class="head"></div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
